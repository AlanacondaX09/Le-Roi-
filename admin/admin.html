<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Le Roi - Admin Login</title>

    <link rel="stylesheet" href="./admin.css">
</head>

<body>

    <main class="login-container">

        <h1>Le Roi 👑</h1>
        <h2>Admin Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </main>


    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Connection -->
    <script src="../js/supabase.js"></script>

    <!-- Admin JavaScript -->
    <script src="./admin.js"></script>

</body>

</html>
