<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Le Roi 👑</title>

    <link
        rel="stylesheet"
        href="./css/login.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">


            <!-- Header -->

            <div class="login-header">

                <div class="logo">
                    Le Roi 👑
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue learning French.
                </p>

            </div>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <!-- Message -->

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


            </form>


            <!-- Register Link -->

            <div class="register-link">

                <p>

                    Don't have an account?

                    <a href="./register.html">
                        Create Account
                    </a>

                </p>

            </div>


        </div>

    </main>


    <!-- Supabase Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- Supabase Connection -->

    <script src="./js/supabase.js"></script>

    <script src="./js/sound.js"></script>


    <!-- Login JavaScript -->

    <script src="./js/login.js"></script>


</body>

</html>
